[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zenos"
version = "0.1.0"
description = "The Zen of AI Workflow Orchestration"
readme = "README.md"
authors = [
    {name = "Kaspars Greizis", email = "kaspars@zenos.ai"}
]
license = {text = "MIT"}
# House rule (.github/CI.md): Python < 3.14 is unsupported, not just discouraged.
# zen/setup/troubleshooter.py::MIN_PYTHON enforces this at dev-session startup too.
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "pydantic>=2.0",
    "aiohttp>=3.8",
    "python-dotenv>=1.0",
    "prompt-toolkit>=3.0",
    "beautifulsoup4>=4.12.0",
    "schedule>=1.2.0",
    "httpx>=0.24.0",
    "aiofiles>=23.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "pip-audit>=2.7",  # dependency vulnerability sanitization — see .github/CI.md
]
mcp = [
    "docker>=6.0",
    "requests>=2.28",
]

[project.scripts]
zen = "zen.cli:main"
zenos = "zen.cli:main"

[project.urls]
Homepage = "https://github.com/k-dot-greyz/zenOS"
Documentation = "https://zenos.ai/docs"
Repository = "https://github.com/k-dot-greyz/zenOS"
Issues = "https://github.com/k-dot-greyz/zenOS/issues"

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["."]
include = ["zen*"]

[tool.black]
line-length = 100
# Deliberately capped below the py314 runtime floor: black --target-version py314
# auto-adopts PEP 758 (unparenthesized multi-exception `except A, B:`), which is
# invalid syntax on anything older than 3.14 and not a style choice this repo has
# actually made. Bump this only as an explicit, reviewed decision — not as a side
# effect of the requires-python floor moving.
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
# See the black target-version comment above — same reasoning applies.
target-version = "py312"
select = ["E", "F", "I", "N", "W", "B", "C90", "D"]
ignore = ["D100", "D104"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=zen --cov-report=term-missing"
