[build-system]
requires = ["setuptools>=84.0", "wheel>=0.48", "pyyaml>=6.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "zenos"
version = "0.1.0"
description = "The Zen of AI Workflow Orchestration"
readme = "README.md"
authors = [
    {name = "Kaspars Greizis", email = "kaspars@zenos.ai"}
]
license = {text = "MIT"}
requires-python = ">=3.14.7"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Coldstart = CLI QoL only. Product/use-case libs live in [product].
dependencies = [
    "click>=8.5",
    "rich>=15.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2",
    "prompt-toolkit>=3.0.53",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "black>=26.5",
    "ruff>=0.16",
    "mypy>=2.3",
    "pre-commit>=4.6",
]
mcp = [
    "docker>=7.2",
    "requests>=2.34",
]
product = [
    "jinja2>=3.1.6",
    "pydantic>=2.13",
    "aiohttp>=3.14",
    "beautifulsoup4>=4.13",
    "schedule>=1.2.2",
    "httpx>=0.28",
    "aiofiles>=25.1",
    "psutil>=7.2",
]

[project.scripts]
zen = "zen.cli:main"
zenos = "zen.cli:main"

[project.urls]
Homepage = "https://github.com/k-dot-greyz/zenOS"
Documentation = "https://zenos.ai/docs"
Repository = "https://github.com/k-dot-greyz/zenOS"
Issues = "https://github.com/k-dot-greyz/zenOS/issues"

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["."]
include = ["zen*"]

[tool.black]
line-length = 100
target-version = ['py314']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C90", "D"]
ignore = ["D100", "D104"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=zen --cov-report=term-missing"
