[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zenos"
version = "0.1.0"
description = "The Zen of AI Workflow Orchestration"
readme = "README.md"
authors = [
    {name = "Kaspars Greizis", email = "kaspars@zenos.ai"}
]
license = {text = "MIT"}
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.2",
    "rich>=14.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5,<2.14",
    "aiohttp>=3.11",
    "python-dotenv>=1.1",
    "prompt-toolkit>=3.0.50",
    "beautifulsoup4>=4.13",
    "schedule>=1.2.2",
    "httpx>=0.28",
    "aiofiles>=24.1",
    "psutil>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "black>=25.1",
    "ruff>=0.11",
    "mypy>=1.15",
    "pre-commit>=4.2",
    "pip-audit>=2.7",  # dependency vulnerability sanitization — see .github/CI.md
]
mcp = [
    "docker>=7.1",
    "requests>=2.32",
]

[project.scripts]
zen = "zen.cli:main"
zenos = "zen.cli:main"

[project.urls]
Homepage = "https://github.com/k-dot-greyz/zenOS"
Documentation = "https://zenos.ai/docs"
Repository = "https://github.com/k-dot-greyz/zenOS"
Issues = "https://github.com/k-dot-greyz/zenOS/issues"

[tool.setuptools]
[tool.setuptools.packages.find]
where = ["."]
include = ["zen*"]

[tool.black]
line-length = 100
# Deliberately capped below the py314 runtime floor: black --target-version py314
# auto-adopts PEP 758 (unparenthesized multi-exception `except A, B:`), which is
# invalid syntax on anything older than 3.14 and not a style choice this repo has
# actually made. This is also why CI's Lint & Format Check is currently red on
# main (target-version py314 makes black want to rewrite tests/test_env_doctor.py
# and others into PEP-758 syntax). Bump this only as an explicit, reviewed
# decision — not as a side effect of the requires-python floor moving.
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
# See the black target-version comment above — same reasoning applies.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C90", "D"]
ignore = ["D100", "D104"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=zen --cov-report=term-missing"
