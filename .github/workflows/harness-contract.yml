name: Harness Contract v1

# ZEN-313 Track 2/3/6: doctor JSON check, contract tests, registry validation.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  harness-contract:
    name: Doctor + contracts + registry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # Root setup.py is an installer script, not setuptools — `pip install -e .`
      # imports zen (needs PyYAML) inside the isolated build env. PYTHONPATH +
      # requirements.txt is the portable Harness Contract v1 install path.
      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: env-doctor JSON (CI profile)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set +e
          python -m zen.cli env-doctor --format json --profile ci > doctor.json
          code=$?
          set -e
          cat doctor.json
          python - <<'PY'
          import json, sys
          payload = json.load(open("doctor.json", encoding="utf-8"))
          doctor = payload["doctor"]
          assert doctor["contract"] == "1.0"
          assert doctor["profile"] == "ci"
          assert doctor["exit_code"] in (0, 10, 20)
          families = {c["family"] for c in doctor["checks"]}
          required = {"runtime", "package_manager", "lockfile", "secrets_presence", "git_state"}
          missing = required - families
          if missing:
              raise SystemExit(f"missing doctor families: {sorted(missing)}")
          print("env-doctor JSON contract ok")
          PY
          if [ "$code" -eq 20 ]; then
            echo "env-doctor blocked (process exit 20)"
            exit 20
          fi
          if [ "$code" -ne 0 ]; then
            echo "unexpected process exit: $code"
            exit "$code"
          fi

      - name: Contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/test_env_doctor_contract.py tests/test_pr_intent.py tests/test_capability_registry.py -v --no-cov

      - name: Registry + pr-intent validation
        env:
          PYTHONPATH: ${{ github.workspace }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          THIS_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "missing event base SHA for changed-path diff"
            exit 20
          fi
          mapfile -t changed < <(git diff --name-only "${BASE_SHA}...HEAD")
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          this = str(os.environ.get("THIS_PR") or "")
          raw = subprocess.check_output(
              ["gh", "pr", "list", "--state", "open", "--json", "number,files", "--limit", "100"],
              text=True,
          )
          others = []
          for pr in json.loads(raw):
              num = str(pr["number"])
              if this and num == this:
                  continue
              files = [f.get("path") for f in (pr.get("files") or []) if f.get("path")]
              others.append({"number": num, "files": files})
          Path("others.json").write_text(json.dumps(others), encoding="utf-8")
          PY
          python scripts/validate_harness_contracts.py --others-json others.json --changed "${changed[@]}"
