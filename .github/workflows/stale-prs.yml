name: Stale PRs

# Label PRs past the Harness Contract v1 default expiry_days (14).
# Per-PR expiry lives in .github/pr-intent.yaml; this workflow is the
# repo-wide backstop (ZEN-313 Track 3).

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: stale
          stale-pr-message: >
            This PR crossed the Harness Contract v1 expiry_days backstop (14).
            Update `.github/pr-intent.yaml` (bump expiry_days or declare supersedes)
            or it will close in 7 days.
          close-pr-message: >
            Closed as stale past expiry_days. Reopen with a fresh pr-intent if the
            change is still needed.
          operations-per-run: 40
