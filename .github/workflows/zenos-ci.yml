name: zenOS CI

# Merge-blocking: black (3.14), identity scanner, pytest.
# Security / shellcheck / docs are informational. See docs/guides/REVIEW.md.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Check Python formatting with black
        run: black --check .

      - name: Check import sorting with isort
        run: isort --check-only .

      - name: Lint Python syntax / undefined names
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  identity:
    name: Identity leak scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Scan working tree for baked-in identity
        run: |
          if [ -f scripts/check_no_identity_leaks.py ]; then
            python scripts/check_no_identity_leaks.py
          else
            echo "Identity scanner not in this checkout, skipping"
          fi

  test:
    name: Python Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install package (root setup.py is an installer, not setuptools)
        run: |
          python -m pip install --upgrade pip
          if [ -f setup.py ]; then mv setup.py _setup.py.bak; fi
          pip install -e ".[dev]"
          if [ -f _setup.py.bak ]; then mv _setup.py.bak setup.py; fi

      - name: Run tests
        run: pytest tests/ -o addopts= -v

  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Bandit security scan
        run: |
          bandit -r . -ll || true
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: safety check --json || true
        continue-on-error: true

  shell-check:
    name: Shell Script Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          if find . -name "*.sh" -type f -print -quit | grep -q .; then
            sudo apt-get update && sudo apt-get install -y shellcheck
            find . -name "*.sh" -type f -exec shellcheck {} \; || echo "::warning::ShellCheck found issues"
          else
            echo "No shell scripts found"
          fi
        continue-on-error: true

  docs:
    name: Documentation Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install mkdocs
        run: pip install mkdocs mkdocs-material

      - name: Build documentation
        run: |
          if [ -f mkdocs.yml ]; then
            mkdocs build --strict
          else
            echo "No mkdocs.yml found, skipping"
          fi
        continue-on-error: true

  ci-success:
    name: CI Status Check
    runs-on: ubuntu-24.04
    needs: [lint, test, identity]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Identity: ${{ needs.identity.result }}"

          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.identity.result }}" != "success" ]; then
            echo "Required checks failed"
            exit 1
          fi
          echo "Required checks passed (security/shell/docs are informational)"
