# zenOS CI — lean gate, not theater
#
# Floor: Python 3.14+. Anything older is out of scope.
# Rust: when Cargo.toml appears, cargo check/test run as a first-class job.
# Dogma: no. This workflow is the living gate; rewrite it when the stack shifts.

name: zenOS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.14
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip

      - name: Install package (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (hard gate: syntax + undefined names)
        run: |
          ruff check zen --select E9,F821,F822,F823
          ruff check zen || true

      - name: Bytecode compile
        run: python -m compileall -q zen

      - name: Pytest
        run: |
          if [ -d tests ]; then
            pytest
          else
            echo "No tests/ directory"
            exit 1
          fi

  rust:
    name: Rust (when present)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Detect Cargo workspace
        id: cargo
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml yet — Rust lane idle (expected until crates land)."
          fi

      - name: Install Rust toolchain
        if: steps.cargo.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check + test
        if: steps.cargo.outputs.present == 'true'
        run: |
          cargo check --workspace
          cargo test --workspace

  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          mapfile -t scripts < <(
            find . -name '*.sh' -type f \
              ! -path './.git/*' \
              ! -path './.venv/*' \
              ! -name 'install.sh' \
              | head -50
          )
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts to check"
            exit 0
          fi
          shellcheck "${scripts[@]}"
