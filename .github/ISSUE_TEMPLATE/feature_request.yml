name: Feature request
description: Suggest an enhancement or new capability
title: "[feat]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        See [CONTRIBUTING.md](https://github.com/k-dot-greyz/zenOS/blob/main/CONTRIBUTING.md#writing-issues) for the What/Why structure we prefer.

  - type: textarea
    id: what
    attributes:
      label: What
      description: Current behavior, desired behavior, and who is affected.
      placeholder: |
        - Current: plugin manifests are validated only at load time
        - Desired: validate manifests in CI with a zen doctor subcommand
        - Affected: plugin authors, CI maintainers
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem this solves and links to related issues or discussions.
    validations:
      required: true

  - type: checkboxes
    id: tasks
    attributes:
      label: Deliverables
      options:
        - label: CLI / command surface
        - label: Core `zen/` package
        - label: Documentation (`docs/`)
        - label: Tests
        - label: Plugin / dex / PKM
        - label: CI / tooling

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why this one is better.
